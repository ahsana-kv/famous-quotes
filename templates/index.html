<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Famous Quotes | 100 Inspiring Quotations</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-decor"></div>

  <header class="app-header">
    <div class="logo">
      <span class="logo-icon">“</span>
      <h1>Famous Quotes</h1>
    </div>
    <div class="stats-badge" id="statsBadge">
      100 Curated Quotes
    </div>
  </header>

  <main class="container">
    <!-- Hero Random Quote Card -->
    <section class="hero-section">
      <div class="quote-card" id="quoteCard">
        <div class="card-glow"></div>
        <div class="quote-header">
          <span class="category-badge" id="quoteCategory">Inspiration</span>
          <span class="quote-id" id="quoteId">#1</span>
        </div>

        <div class="quote-body">
          <div class="quote-mark open">“</div>
          <p class="quote-text" id="quoteText">The only way to do great work is to love what you do.</p>
          <div class="quote-mark close">”</div>
        </div>

        <div class="quote-footer">
          <div class="author-wrap">
            <span class="dash">—</span>
            <span class="author-name" id="quoteAuthor">Steve Jobs</span>
          </div>
          
          <div class="card-actions">
            <button class="btn btn-secondary" id="copyBtn" title="Copy to clipboard">
              <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span id="copyBtnText">Copy</span>
            </button>

            <button class="btn btn-primary" id="newQuoteBtn">
              <svg class="icon spin-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
              </svg>
              <span>New Quote</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Search & Filter Controls -->
    <section class="controls-section">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search by author, quote keyword, or category..." 
          autocomplete="off"
        >
        <button class="clear-btn hidden" id="clearSearchBtn" title="Clear search">&times;</button>
      </div>

      <div class="category-filters-wrap">
        <label class="filters-label">Categories:</label>
        <div class="category-pills" id="categoryPills">
          <button class="pill active" data-category="">All</button>
          <!-- Dynamic Category Pills Injected via JS -->
        </div>
      </div>
    </section>

    <!-- Search Results / Catalog View -->
    <section class="results-section hidden" id="resultsSection">
      <div class="results-header">
        <h2 id="resultsTitle">Search Results</h2>
        <span class="results-count" id="resultsCount">0 quotes found</span>
      </div>

      <div class="quotes-grid" id="quotesGrid">
        <!-- Quotes matching search or category injected via JS -->
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>Famous Quotes Collection &bull; Built with Flask &amp; Vanilla JavaScript</p>
  </footer>

  <div class="toast hidden" id="toast">Copied to clipboard!</div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
